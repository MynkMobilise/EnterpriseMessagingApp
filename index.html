  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>WhatsApp Business API Micro-App</title>
      <!-- Inter — the editorial sans-serif used by Linear/Vercel/Stripe.
           Preconnect cuts cold-start latency; the font-display:swap in the URL
           keeps text visible during load instead of FOIT. -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
      <style>
        /* Reset browser default body margin so the app fills the viewport edge to edge.
           Per-page overflow is owned by the page's own container (e.g. Login uses
           h-screen overflow-hidden; AppLayout pages scroll naturally inside <main>). */
        html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; }
      </style>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
